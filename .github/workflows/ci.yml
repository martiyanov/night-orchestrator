name: CI
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y jq shellcheck
        if: false  # jq предустановлен; shellcheck опционален (см. шаг ниже)
      - name: shell syntax
        run: for f in bin/*.sh scripts/*.sh examples/skills/*/bin/*.sh; do bash -n "$f"; done
      - name: python syntax
        run: python3 -m py_compile bin/intake.py examples/skills/*/route.py
      - name: JSON + schemas
        run: |
          for j in contracts/*.json examples/*.json config/*.example.json; do jq -e . "$j" >/dev/null || exit 1; done
          pip install jsonschema && python3 - <<'PY'
          import json, glob, jsonschema
          schemas = {**{s.split('/')[-1]: json.load(open(s)) for s in glob.glob('contracts/*.schema.json')}}
          r = json.load(open('examples/RESULT.example.json'))
          jsonschema.validate(r, schemas['RESULT.schema.json'])
          t = json.load(open('examples/TASK.example.json'))
          jsonschema.validate(t, schemas['TASK.schema.json'])
          print('examples validate')
          PY
      - name: secret scan
        run: ./scripts/secret-scan.sh
      - name: selftest (default)
        run: |
          set -o pipefail
          ./bin/selftest.sh 2>&1 | tee /tmp/selftest-default.log || code=$?
          grep "FAIL:" /tmp/selftest-default.log | while IFS= read -r line; do
            echo "::error::DEF: ${line:0:250}"
          done
          if [ "${code:-0}" != "0" ] && ! grep -q "FAIL:" /tmp/selftest-default.log; then
            tail -n 40 /tmp/selftest-default.log | while IFS= read -r line; do
              echo "::error::DEF-TAIL: ${line:0:250}"
            done
          fi
          exit ${code:-0}
      - name: selftest (full)
        run: |
          set -o pipefail
          ./bin/selftest.sh --full 2>&1 | tee /tmp/selftest-full.log || code=$?
          grep "FAIL:" /tmp/selftest-full.log | while IFS= read -r line; do
            echo "::error::${line:0:250}"
          done
          if [ "${code:-0}" != "0" ] && ! grep -q "FAIL:" /tmp/selftest-full.log; then
            tail -n 40 /tmp/selftest-full.log | while IFS= read -r line; do
              echo "::error::TAIL: ${line:0:250}"
            done
          fi
          exit ${code:-0}

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
    steps:
      - name: Create release unless it already exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it unchanged."
            exit 0
          fi

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$TAG" \
            --generate-notes
